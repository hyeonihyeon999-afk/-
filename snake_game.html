<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뱀 게임 (Snake Game)</title>
  
  <!-- [CSS 영역]: 웹페이지의 스타일과 디자인을 담당합니다 -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 100%;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .score-box {
      background: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      color: #38bdf8;
    }

    .high-score-box {
      background: #334155;
      padding: 8px 16px;
      border-radius: 8px;
      color: #facc15;
    }

    canvas {
      background-color: #020617;
      border: 3px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      max-width: 100%;
      height: auto;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #7dd3fc;
    }

    button:active {
      transform: scale(0.95);
    }

    /* 모바일 가상 패드 스타일 */
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
      width: 200px;
    }

    .d-btn {
      background-color: #334155;
      color: white;
      border: 1px solid #475569;
      font-size: 1.2rem;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .d-btn:active {
      background-color: #475569;
    }

    .empty {
      visibility: hidden;
    }

    /* PC 전용 안내 텍스트 */
    .instructions {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @media (min-width: 600px) {
      .mobile-controls {
        display: none; /* PC 화면에서는 가상 패드 숨김 */
      }
    }
  </style>
</head>
<body>

  <!-- [HTML 영역]: 게임의 레이아웃과 요소를 구성합니다 -->
  <div class="game-container">
    <div class="header">
      <div class="score-box">점수: <span id="score">0</span></div>
      <div class="high-score-box">최고 점수: <span id="high-score">0</span></div>
    </div>

    <!-- 게임 화면이 그려지는 Canvas -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
      <button id="restartBtn">게임 시작 / 재시작</button>
    </div>

    <!-- 모바일 터치 조작 패드 -->
    <div class="mobile-controls">
      <div class="empty"></div>
      <button class="d-btn" id="upBtn">▲</button>
      <div class="empty"></div>
      <button class="d-btn" id="leftBtn">◀</button>
      <button class="d-btn" id="downBtn">▼</button>
      <button class="d-btn" id="rightBtn">▶</button>
    </div>

    <div class="instructions">
      키보드 화살표 키를 사용하여 방향을 조절하세요.
    </div>
  </div>

  <!-- [JavaScript 영역]: 게임 로직과 규칙, 상호작용을 제어합니다 -->
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const restartBtn = document.getElementById('restartBtn');

    // 게임 보드 설정
    const gridSize = 20; // 한 칸의 크기 (px)
    const tileCount = canvas.width / gridSize; // 총 가로/세로 칸 수 (20x20)

    // 게임 상태 변수
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize; // X축 이동 방향
    let dy = 0;        // Y축 이동 방향
    let score = 0;
    let highScore = 0;
    let gameLoop = null;
    let isGameOver = false;
    let changingDirection = false; // 한 프레임 내 중복 방향 전환 방지

    // 게임 초기화
    function initGame() {
      snake = [
        { x: 160, y: 200 },
        { x: 140, y: 200 },
        { x: 120, y: 200 }
      ];
      score = 0;
      dx = gridSize;
      dy = 0;
      isGameOver = false;
      scoreElement.textContent = score;
      
      generateFood();
      
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(main, 100); // 100ms마다 게임 업데이트 (속도 조절 가능)
    }

    // 메인 루프
    function main() {
      if (isGameOver) return;

      changingDirection = false;
      clearCanvas();
      drawFood();
      moveSnake();
      drawSnake();
      checkCollision();
    }

    // 화면 지우기
    function clearCanvas() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 뱀 그리기
    function drawSnake() {
      snake.forEach((part, index) => {
        // 머리와 몸통 색상 구분
        ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
        ctx.strokeStyle = '#020617';
        ctx.fillRect(part.x, part.y, gridSize, gridSize);
        ctx.strokeRect(part.x, part.y, gridSize, gridSize);
      });
    }

    // 뱀 이동
    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // 음식을 먹었는지 확인
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreElement.textContent = highScore;
        }
        generateFood();
      } else {
        snake.pop(); // 먹지 않았다면 꼬리 제거
      }
    }

    // 음식 생성 (뱀 몸통과 겹치지 않게)
    function generateFood() {
      while (true) {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;

        let overlap = false;
        for (let part of snake) {
          if (part.x === food.x && part.y === food.y) {
            overlap = true;
            break;
          }
        }
        if (!overlap) break;
      }
    }

    // 음식 그리기
    function drawFood() {
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 충돌 검사 (벽 또는 자기 몸통)
    function checkCollision() {
      const head = snake[0];

      // 벽에 부딪힘
      const hitLeft = head.x < 0;
      const hitRight = head.x >= canvas.width;
      const hitTop = head.y < 0;
      const hitBottom = head.y >= canvas.height;

      if (hitLeft || hitRight || hitTop || hitBottom) {
        gameOver();
        return;
      }

      // 자기 몸통에 부딪힘
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }
    }

    // 게임 오버 처리
    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);

      // 게임 오버 문구 출력
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('게임 오버!', canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('버튼을 눌러 다시 시작하세요', canvas.width / 2, canvas.height / 2 + 25);
    }

    // 방향 전환 처리
    function changeDirection(direction) {
      if (changingDirection) return;

      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;

      if (direction === 'LEFT' && !goingRight) {
        dx = -gridSize;
        dy = 0;
        changingDirection = true;
      }
      if (direction === 'UP' && !goingDown) {
        dx = 0;
        dy = -gridSize;
        changingDirection = true;
      }
      if (direction === 'RIGHT' && !goingLeft) {
        dx = gridSize;
        dy = 0;
        changingDirection = true;
      }
      if (direction === 'DOWN' && !goingUp) {
        dx = 0;
        dy = gridSize;
        changingDirection = true;
      }
    }

    // 키보드 이벤트 리스너
    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowLeft':
          changeDirection('LEFT');
          break;
        case 'ArrowUp':
          changeDirection('UP');
          break;
        case 'ArrowRight':
          changeDirection('RIGHT');
          break;
        case 'ArrowDown':
          changeDirection('DOWN');
          break;
      }
    });

    // 모바일 방향키 버튼 이벤트
    document.getElementById('leftBtn').addEventListener('click', () => changeDirection('LEFT'));
    document.getElementById('upBtn').addEventListener('click', () => changeDirection('UP'));
    document.getElementById('rightBtn').addEventListener('click', () => changeDirection('RIGHT'));
    document.getElementById('downBtn').addEventListener('click', () => changeDirection('DOWN'));

    // 재시작 버튼
    restartBtn.addEventListener('click', () => {
      initGame();
    });

    // 초기 게임 화면 렌더링
    clearCanvas();
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('시작하려면 아래 버튼을 누르세요', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
